name: 평일 식단 자동 게시

on:
  schedule:
    - cron: '30 21 * * 0-4'
  workflow_dispatch:

concurrency:
  group: campus-menu-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: 수집 및 게시 파일 생성
        run: python scripts/make_post.py
      - run: python -m pytest -q
      - name: 정상 데이터만 커밋
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw data/menu site/src/content/posts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(menu): publish $(TZ=Asia/Seoul date +%F)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  notify:
    needs: publish
    if: failure() && needs.publish.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - name: 관리자 알림
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day="$(TZ=Asia/Seoul date +%F)"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue create --repo "${GITHUB_REPOSITORY}" --title "[식단 게시 실패] ${day}" \
            --body "평일 식단을 갱신하지 못했습니다. 마지막 정상 수집분을 계속 표시합니다. 실행 기록: ${run_url}"
      - uses: actions/checkout@v7
        if: always()
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: 실행 로그 기록
        if: always()
        run: |
          day="$(TZ=Asia/Seoul date +%F)"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          entry="- ${day} 식단 게시 실패 · [실행 ${GITHUB_RUN_ID} #${GITHUB_RUN_ATTEMPT}](${run_url})"
          if rg -F -q -- "${entry}" docs/run-log.md; then
            exit 0
          fi
          printf '%s\n' "${entry}" >> docs/run-log.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/run-log.md
          git commit -m "docs(menu): record unsuccessful publish ${day}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
